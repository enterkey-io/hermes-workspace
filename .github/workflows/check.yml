name: Client foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:avatars
      - run: npm audit --omit=dev --audit-level=high
      - run: python3 -m venv /tmp/bot-web-test-env
      - run: /tmp/bot-web-test-env/bin/pip install -r test/plugin/requirements.txt
      - run: /tmp/bot-web-test-env/bin/python -m unittest discover -s test/plugin -p 'test_*.py'
